<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A second line behind the escaping: only our own files run, pictures only as data: URLs, no
         network. Orca's own frame policy already sits under this one; a page policy can only tighten
         it. Styles keep 'unsafe-inline' because Orca's frame shell rewrites its inline token <style>
         on a theme change; this page itself uses no inline style. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
    <title>Funnel graph</title>
    <link rel="stylesheet" href="./graph.css" />
  </head>
  <body>
    <header class="top">
      <h1>Funnel graph</h1>
      <span class="status" id="status" aria-live="polite">reading…</span>
      <button type="button" class="refresh" id="refresh" title="Read the funnel again now">Refresh</button>
    </header>
    <div class="notes" id="notes"></div>
    <section class="unlinked" id="unlinked" aria-label="Waits no piece of work holds"></section>
    <div class="scroll" id="graph"></div>
    <div class="legend" id="legend" aria-label="Wire colours"></div>
    <section class="doing" id="doing" aria-label="What the bots are doing"></section>
    <script type="module" src="./page.js"></script>
  </body>
</html>
